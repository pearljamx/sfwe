<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 智慧渔场物联网管控系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-screen">
  <main class="login-shell">
    <section class="login-hero">
      <p class="eyebrow">Smart Fishery Operations</p>
      <h1>智慧渔场物联网管控系统</h1>
      <p>面向水质监测、设备远程控制、AI 鱼病识别和鱼苗供应链协同的 Web 管控平台。</p>
      <div class="login-kpis">
        <span>7×24 实时监测</span>
        <span>UDP 热点闭环</span>
        <span>AI 边缘识别</span>
      </div>
    </section>
    <form class="login-card" method="post">
      <div class="brand-row">
        <span class="brand-mark">SF</span>
        <div>
          <strong>进入系统</strong>
          <small>数据来源：SFweb MySQL</small>
        </div>
      </div>
      <div class="role-toggle">
        <label class="{{ 'active' if selected_role != 'supplier' else '' }}">
          <input type="radio" name="role" value="admin" {{ 'checked' if selected_role != 'supplier' else '' }}>
          管理端
        </label>
        <label class="{{ 'active' if selected_role == 'supplier' else '' }}">
          <input type="radio" name="role" value="supplier" {{ 'checked' if selected_role == 'supplier' else '' }}>
          供应商端
        </label>
      </div>
      <label>账号<input name="username" placeholder="admin / supplier1" required></label>
      <label>密码<input name="password" type="password" placeholder="请输入密码" required></label>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <button class="primary full" type="submit">登录</button>
      <p class="hint">管理员 admin/admin123，供应商 supplier1/supplier123</p>
    </form>
  </main>
  <script>
    document.querySelectorAll(".role-toggle label").forEach((label) => {
      label.addEventListener("click", () => {
        document.querySelectorAll(".role-toggle label").forEach((item) => item.classList.remove("active"));
        label.classList.add("active");
        const input = label.querySelector("input[type='radio']");
        if (input) input.checked = true;
      });
    });
  </script>
</body>
</html>

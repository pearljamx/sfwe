{% extends "base.html" %}
{% block content %}
<section class="tools-row">
  <select id="analyticsMetric">
    {% for key, name, unit in data.parameters %}<option value="{{ key }}">{{ name }}</option>{% endfor %}
  </select>
</section>
<section class="dashboard-grid">
  <article class="panel wide-panel"><div class="panel-head"><h3>指标趋势对比</h3></div><div class="chart tall" id="metricCompareChart"></div></article>
  <article class="panel"><div class="panel-head"><h3>风险分布</h3></div><div class="chart" id="riskChart"></div></article>
  <article class="panel"><div class="panel-head"><h3>设备能耗</h3></div><div class="chart" id="energyChart"></div></article>
</section>
{% endblock %}
{% block scripts %}
<script>
window.analyticsData = {{ data|tojson }};
</script>
{% endblock %}
